modLoader = "javafml"
loaderVersion = "[1,)"
license = "MIT"
issueTrackerURL = "https://github.com/nennneko5787/Lepus/issues"

# minecraftVersion is filled in per node by processResources. Each jar is compiled against exactly
# one Minecraft version and is pinned to it: the classes it calls do not exist on the other one, so
# a range spanning the 1.21.11/26.2 seam would let the mod load and then die. SC-220 section 6 keeps
# adding a version down to settings.gradle.kts plus one buildscript entry.

[[mods]]
modId = "lepus"
version = "0.1.0"
displayName = "Lepus"
authors = "nennneko5787"
description = '''
Run Minecraft Bedrock Edition Add-Ons on Minecraft Java Edition.

Loads .mcaddon and .mcpack files - behaviour packs and resource packs - and executes them inside
Java Edition: custom blocks, items, entities with their component and AI-goal definitions, Bedrock
skeletal models and animations, Molang, Snowstorm particles, loot tables, recipes and spawn rules.
'''

[[dependencies.lepus]]
modId = "neoforge"
type = "required"
versionRange = "[1,)"
ordering = "NONE"
side = "BOTH"

# Mixins are the loader's, on this loader. Fabric names the same file from fabric.mod.json; here it
# is a file reference, and the config itself only EXISTS on the node whose class it lists - see
# build.neoforge.gradle.kts and the intersection directory's comment. The marker below becomes the
# real block on a node that ships one and VANISHES on a node that does not, because a config with
# `"required": true` that names a class the jar does not contain fails the launch rather than
# skipping the mixin, and a declared config the jar lacks is the same failure one step earlier.
@@MIXINS@@

[[dependencies.lepus]]
modId = "minecraft"
type = "required"
# Pinned to exactly the version this jar was compiled against - see fabric.mod.json for why.
versionRange = "[${minecraftVersion}]"
ordering = "NONE"
side = "BOTH"
