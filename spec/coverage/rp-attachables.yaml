# A held or worn 3D model with its own geometry, animations and render controllers. NO Java equivalent - the largest single piece of work in SC-170.
#
# Status meanings: spec/normative/SC-000-conventions.md section 3.
# `implemented` is written by hand and VERIFIED by the build - ADR-0011, constitution rule 9.

domain: rp-attachables
spec: SC-170
upstream: null

entries:
  - id: attachable/geometry
    status: stub
  - id: attachable/materials
    status: stub
  - id: attachable/textures
    status: stub
  - id: attachable/animations
    status: partial
    impl: net.nennneko5787.lepus.core.format.render.AttachablePoser
    fields:
      animation: ok
      animation_controller: ok
    fidelity: >-
      Short name -> identifier, resolved against every enabled pack in order, animations first and
      controllers second. A name that resolves to neither is skipped: Mojang's own controllers are
      not in the add-on, and one pack in the corpus misspells one of its own entries.

      SC-180 sections 4 and 5 carry the divergences of what the resolved things then do.
  - id: attachable/animation_controllers
    status: partial
    impl: net.nennneko5787.lepus.core.format.render.AnimationControllerPlayer
    fields:
      shipped_by_the_pack: ok
      vanilla: missing
    fidelity: >-
      An entry of `scripts.animate` naming a controller now runs it. Resolution is by short name
      against the attachable's own `animations` map, animations first and controllers second, so a
      controller naming another controller resolves to nothing - nothing in the surveyed corpus does
      it, and it needs a cycle check rather than an ordering.

      A controller the add-on does not ship resolves to nothing and plays nothing. Two of the three
      attachables in the corpus name `controller.animation.elytra.default`, which is in Mojang's
      resource pack; that file may not be vendored (constitution rule 10) and is not fetched at
      runtime. Its five states name animations those attachables mostly do not define, so most of it
      would draw nothing even if it were resolved.

      The machine's state is kept per holder, one transition per frame. SC-180 section 5.2.
  - id: attachable/render_controllers
    status: stub
  - id: attachable/scripts
    status: partial
    impl: net.nennneko5787.lepus.core.format.render.AttachablePoser
    fields:
      pre_animation: ok
      animate: ok
      animate_blend: ok
      scale: missing
      initialize: missing
      parent_setup: missing
    fidelity: >-
      `pre_animation` runs first every frame, and its assignments are what the `animate` conditions
      read - evaluating them the other way round leaves every `v.` at zero, which answers "no" to
      every question a pack asks about itself.

      An `animate` entry's Molang expression is a BLEND AMOUNT, not a condition: SC-180 section
      4.1.1. Every condition in the surveyed corpus is a comparison answering zero or one, so this
      is indistinguishable there and differs for vanilla's own entries, which blend a walk by
      `query.modified_move_speed`.

      An entry naming an animation CONTROLLER rather than an animation runs it - SC-180 section 5 -
      unless the controller is one the add-on does not ship, which is the case for the two
      attachables naming Mojang's `controller.animation.elytra.default`.

      An animation's clock is the HOLDER's, starting the first frame that entry's blend is non-zero
      and running from then on whatever the blend does. `scripts.initialize`, `scripts.scale` and
      `scripts.variables` are still not read. SC-180 section 4.1.1.
  - id: attachable/item
    status: partial
    impl: net.nennneko5787.lepus.runtime.registry.BoundAttachables
    fields:
      add_on_item: ok
      vanilla_item: ok
      # Ignored the way Bedrock ignores them, not the way an unimplemented thing is ignored.
      vanilla_item_first_person_animations: ignored
    diagnostics: [SCE-2041, SCE-2042]
    fidelity: >-
      An attachable is keyed by the identifier of the item it dresses and a pack may name one it did
      not define. An add-on item binds under its logical identifier; a vanilla one binds under its
      own registry name, which is what such a stack already carries. A stack is asked for its logical
      identity first and for its registry name only in its absence, so a carrier item whose content
      is unbound can never fall through to a vanilla binding. Nothing is registered either way.

      A vanilla item's attachable is drawn in THIRD PERSON ONLY, and that is measured rather than
      chosen: a probe on `minecraft:stick` with an unconditional `scripts.animate` was drawn in third
      person by a Bedrock client and not at all in first, and a later probe on a custom item held the
      same way with the same bones WAS drawn in first person - so vanilla-versus-custom is the
      isolated variable. The corpus's one such pack writes four first-person animations Bedrock never
      plays, and this build does not play them either.

      The item therefore keeps drawing itself in first person, and its item definition is replaced
      with one blanking the two third-person hand contexts alone - against the four an add-on item
      blanks, where the hand hook draws instead. That replacement is served in the `minecraft`
      namespace, which is what a Bedrock pack does to a vanilla item.

      Vanilla's own definition is WRAPPED rather than rewritten: it is read out of the game's jar and
      its `model` carried across verbatim as the fallback, so a bow's condition over `using_item` and
      the range dispatch beneath it, a potion's tint and a compass's needle all survive untouched. A
      definition that cannot be read is not replaced at all - no override is written, the attachable
      still draws, the flat sprite draws with it, and SCE-2042 says so. An add-on may change how an
      item is drawn; it may not cost the item its behaviour.

      An attachable naming an identifier that is neither a pack's item nor a registered one resolves
      to nothing and reports SCE-2041. The pack that also replaces such an item's ICON does it by
      writing over the vanilla texture path, which is `rp-textures` and not this entry.
  - id: attachable/first_person
    status: partial
    impl: net.nennneko5787.lepus.client.render.FirstPersonAttachables
    fields:
      main_hand: ok
      off_hand: ok
      worn_slots: missing
    fidelity: >-
      It does need its own path, and the reason is not that hand rendering is awkward: Bedrock does
      not draw an attachable at the hand at all. It poses it in PLAYER space, which in first person
      is a space the game never draws in, because no player model is submitted. So the space is
      rebuilt against the camera, and the order that survives measurement is the short one: the
      origin is dropped to the feet by the player's own eye height, read per frame, and NOTHING is
      rotated. Two Bedrock screenshots, one pitched fully up and one fully down, put the
      character's parts in the same screen positions - so the model rides the camera, and undoing the
      camera was tried and had to come out.

      AN EARLIER VERSION OF THIS NOTE DESCRIBED AN IMPLEMENTATION THAT NO LONGER EXISTS. It
      explained the space as undoing the camera's pitch and its yaw-over-body, and it justified the
      order of the steps by a 1.62 sin(pitch) error that ordering would have caused. All of that was
      removed with the rotation it described. Read this paragraph, not that one.

      The scale is the part with no measurement behind it. First person multiplies by the 0.9375 a
      player model carries, written out by hand because nothing in the first-person pass supplies
      it, and the reason recorded in the source is that the model was "6.7% larger than the same
      model on the same player seen from outside". That reason is the premise the rotation work
      above refuted - first person is not the player's space, so its size is not the third-person
      size - and the constant outlived the diagnosis, the same way a mirror once did. Two paired
      captures of the corpus's body-parented character put its head visibly LARGER on the Bedrock
      client than here, by more than 6.7%, so removing the constant is not known to be the whole of
      it and is not known to be right either. It needs its own frame.

      A worn attachable is not drawn in first person. The seam is the hand render, which is offered
      the two hands and nothing else; the four armour slots reach the third-person layer only. A
      halo sits above and behind the eye and would be invisible anyway, but an armour attachable
      that reaches in front of the player is a real omission rather than a hidden one.

      WHAT IS CONFIRMED, and what is not, was re-measured against a pair of captures rather than
      inherited. Confirmed: the channel composition (independent channels, translation outermost,
      SC-180 section 4.1.3), that a conditional entry fires (section 4.4), that the wearer's `body`
      carries a half turn in first person (section 4.2.1), and that a model in this build lands where
      the offline survey says it does - the survey's own numbers predict this build's head centre at
      20% of screen width and the capture puts it at 20%, so the instrument is good to about 1.5%
      and the numbers below it can be believed.

      NOT confirmed, and now contradicted: the claim that the character appears "face visible, on
      both clients". On the same pair of captures her face is visible on the Bedrock client and NOT
      here. The head's net rotation about Y is what decides that, and this build's is 180 (wearer)
      plus -85 (`root2`, the pack's own first-person animation) plus -25 (`head2`) = +70 degrees, so
      she is turned away. No combination of the two wearer's half turns and either sign of the
      pack's own angles reaches zero, which is what a face-on head needs - so the difference is not
      the wearer's half turn and has not been located.

      The bone rotation order (SC-180 section 4.2) is NOT the cause either, and that was worth
      knowing: all six orders were computed over the real rig and every one of them leaves the head
      turned away, the whole extents moving by under half a block. A rig whose head chain turns
      about one axis at a time cannot testify about the order, and this one cannot be fixed by
      choosing among them.

      Both clients draw this pass with a fixed projection that ignores the FOV setting (measured),
      and the difference between those two fixed projections is not a vertical 60-versus-70:
      scaling camera-space x and y by tan(35)/tan(30) - the correction that premise derives - made
      the matched character visibly worse. Five fitted constants and one derived one have died on
      this residual, and a sixth will not be found by fitting. The survey is the instrument that
      does not fit, and what it needs next is a probe carrying a gauge of known length, so that size
      and distance arrive as numbers instead of as a comparison of two silhouettes.

      `:testkit:survey` can now answer the two-view question in one run
      (`attachable.<id> compare`): which entries of `scripts.animate` resolved in each view, what
      each condition evaluated to, whether each animation can draw at all, and each bone's facing
      and scale. The last two are properties of the POSE and so compare across views, which the
      extents do not - those are in each view's own space, and putting them in one space needs a
      player yaw an offline tool does not have and will not invent. Run against the corpus's two
      characters it separates them in a single cell: the `waist`-parented one's first-person
      animation reads a blend of 1.00 and DRAWS NOTHING, because it is a zero-length `loop: true`
      that ends on every frame, while the `body`-parented one's reads the same 1.00 and draws.
      Every bone of the first poses identically in both views; every bone of the second differs.
      **That is the whole of the difference between a character that is right in both views and one
      that is not, and it is the `loop` rule of SC-180 section 4.1 - not a coordinate space, not a
      projection, and not a constant.** The one open question this leaves is whether the Bedrock
      client applies that second character's zero-length `hold_on_last_frame` at all, because if it
      does not she would sit at bind-plus-idle there, her head facing the viewer, which is what the
      capture shows. That is a question about the engine, not about a number to add.

      Three of the corpus's attachables name vanilla's `controller.animation.elytra.default` in
      `scripts.animate` and no pack ships it, so this build resolves the entry to nothing and prints
      it unresolved in BOTH views. Checked against Mojang's own file rather than assumed: the
      controller's states play the bare short names `default`, `gliding`, `sneaking`, `sleeping` and
      `swimming`, and short names resolve against the attachable's own `animations` map, which
      defines none of those five for this item - so it is inert here, and its absence cannot be the
      first-person difference. **The general gap is real, though, and worth naming: this build has
      no vanilla animation namespace at all, so a pack naming a vanilla animation or animation
      controller silently loses it.** That is a missing-implementation category rather than a bug, and
      nothing in the ledger records it.

  - id: attachable/worn
    status: partial
    impl: net.nennneko5787.lepus.client.render.AttachableLayer
    fields:
      head: ok
      chest: ok
      legs: ok
      feet: ok
      first_person: missing
    fidelity: >-
      A worn attachable reaches the render layer only because the stack's minecraft:equippable names
      an equipment asset. Vanilla filters what it puts on the render state -
      HumanoidMobRenderer.getEquipmentIfRenderable asks HumanoidArmorLayer.shouldRender, which asks
      assetId().isPresent() - so a stack without one leaves headEquipment and its three neighbours
      empty and the layer is handed nothing at all.

      The asset named is ours and draws nothing: it declares a single layer of a type no humanoid
      renders, because the codec rejects an empty layer map and any type a humanoid DOES render
      would put a flat armour piece over the model.

      This lives on the STACK, so a stack made by an older build carries an equippable without the
      asset and stays invisible until it is made again (SC-120 section 5). That is a real upgrade
      hazard, not only a development one.

      Vanilla's CustomHeadLayer still draws the item's own flat model on the head, beside the
      attachable. Bedrock shows only the attachable.
